<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget OBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* ─────────────── Variables de color por juego ─────────────── */
        :root {
            --neon: #00e5ff;
            --bg: #07090f;
            --card: rgba(0, 229, 255, 0.07);
        }

        body.lol {
            --neon: #f0b429;
        }

        body.valorant {
            --neon: #ff4655;
        }

        /* ─────────────── Container ─────────────── */
        .widget {
            width: 960px;
            min-height: 540px;
            background: var(--bg);
            padding: 18px;
            position: relative;
        }

        /* ─────────────── Header ─────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--neon);
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--neon);
            text-shadow: 0 0 12px var(--neon);
        }

        .header-phase {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* ─────────────── Swiss Grid ─────────────── */
        .swiss-grid {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .round-col {
            flex: 1;
            min-width: 160px;
        }

        .round-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--neon);
            text-align: center;
            padding: 4px 0 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 8px;
        }

        .match-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 7px;
            position: relative;
            overflow: hidden;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--neon);
            opacity: 0.5;
        }

        .match-card.done::before {
            opacity: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 3px 0;
        }

        .team-logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: var(--neon);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .team-name {
            flex: 1;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.85);
        }

        .team-name.winner {
            color: var(--neon);
            text-shadow: 0 0 8px var(--neon);
        }

        .team-score {
            font-size: 14px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.6);
            min-width: 16px;
            text-align: right;
        }

        .team-score.winner {
            color: var(--neon);
        }

        .match-vs {
            text-align: center;
            font-size: 8px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.15em;
            margin: 1px 0;
        }

        .match-bye {
            font-size: 10px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 0;
        }

        /* ─────────────── Elimination Bracket ─────────────── */
        .elim-container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .elim-round {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: space-around;
        }

        .elim-round-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-align: center;
            color: var(--neon);
            margin-bottom: 6px;
        }

        /* ─────────────── Standings ─────────────── */
        .standings {
            margin-top: 14px;
        }

        .standings-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
        }

        .standings-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .standings-pos {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            min-width: 18px;
            text-align: center;
        }

        .standings-pos.top {
            color: var(--neon);
        }

        .standings-name {
            flex: 1;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .standings-record {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.5);
        }

        .standings-record span {
            color: var(--neon);
        }

        /* Champion banner */
        .champion-banner {
            text-align: center;
            padding: 20px;
        }

        .champion-title {
            font-size: 13px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .champion-name {
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--neon);
            text-shadow: 0 0 30px var(--neon), 0 0 60px var(--neon);
            letter-spacing: 0.05em;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon);
            }

            to {
                text-shadow: 0 0 40px var(--neon), 0 0 80px var(--neon), 0 0 120px var(--neon);
            }
        }
    </style>
</head>

<body id="widget-body">

    <div class="widget" id="widget-root">
        <!-- Rendered by JS -->
    </div>

    <script>
        const TOURNAMENT_ID = '%TOURNAMENT_ID%';
        const PHASE_FILTER = '%PHASE_FILTER%';
        let data = null;

        async function fetchData() {
            try {
                const res = await fetch(`/lol/${TOURNAMENT_ID}/widget-data`);
                data = await res.json();
                render();
            } catch (e) { console.error(e); }
        }

        function teamLogo(team) {
            if (!team) return '';
            if (team.logo) return `<div class="team-logo"><img src="${team.logo}" alt="${team.name}" /></div>`;
            return `<div class="team-logo">${team.name[0]}</div>`;
        }

        function renderMatch(m) {
            if (!m.team2) {
                // BYE
                return `<div class="match-card done">
        ${teamLogo(m.team1)}
        <div class="team-name winner">${m.team1 ? m.team1.name : 'TBD'}</div>
        <div class="match-bye">BYE</div>
      </div>`;
            }
            const w = m.winner_id;
            return `<div class="match-card ${m.status === 'done' ? 'done' : ''}">
      <div class="team-row">
        ${teamLogo(m.team1)}
        <div class="team-name ${w === m.team1_id ? 'winner' : ''}">${m.team1 ? m.team1.name : 'TBD'}</div>
        <div class="team-score ${w === m.team1_id ? 'winner' : ''}">${m.score1}</div>
      </div>
      <div class="match-vs">VS</div>
      <div class="team-row">
        ${teamLogo(m.team2)}
        <div class="team-name ${w === m.team2_id ? 'winner' : ''}">${m.team2 ? m.team2.name : 'TBD'}</div>
        <div class="team-score ${w === m.team2_id ? 'winner' : ''}">${m.score2}</div>
      </div>
    </div>`;
        }

        function renderSwiss(matches) {
            const rounds = {};
            matches.filter(m => m.phase === 'swiss').forEach(m => {
                if (!rounds[m.round]) rounds[m.round] = [];
                rounds[m.round].push(m);
            });
            const roundKeys = Object.keys(rounds).sort((a, b) => a - b);
            if (roundKeys.length === 0) return '';

            return `<div class="swiss-grid">
      ${roundKeys.map(r => `
        <div class="round-col">
          <div class="round-label">Swiss R${r}</div>
          ${rounds[r].map(renderMatch).join('')}
        </div>
      `).join('')}
    </div>`;
        }

        function elim_round_label(round, totalRounds, roundKeys) {
            const diff = totalRounds - roundKeys.indexOf(String(round));
            if (diff === 1) return 'Gran Final';
            if (diff === 2) return 'Semifinal';
            if (diff === 3) return 'Cuartos';
            return `Ronda ${round}`;
        }

        function renderElim(matches) {
            const rounds = {};
            matches.filter(m => m.phase === 'elimination').forEach(m => {
                if (!rounds[m.round]) rounds[m.round] = [];
                rounds[m.round].push(m);
            });
            const roundKeys = Object.keys(rounds).sort((a, b) => a - b);
            if (roundKeys.length === 0) return '';

            return `<div class="elim-container">
      ${roundKeys.map(r => `
        <div class="elim-round">
          <div class="elim-round-label">${elim_round_label(Number(r), roundKeys.length, roundKeys)}</div>
          ${rounds[r].map(renderMatch).join('')}
        </div>
      `).join('')}
    </div>`;
        }

        function renderStandings(teams) {
            const sorted = [...teams].sort((a, b) => b.wins - a.wins || a.losses - b.losses);
            return `<div class="standings">
      <div class="standings-title">Clasificación</div>
      ${sorted.map((t, i) => `
        <div class="standings-row">
          <div class="standings-pos ${i < 3 ? 'top' : ''}">${i + 1}</div>
          ${teamLogo(t)}
          <div class="standings-name">${t.name}</div>
          <div class="standings-record"><span>${t.wins}W</span> ${t.losses}L</div>
        </div>
      `).join('')}
    </div>`;
        }

        function render() {
            if (!data) return;
            const { tournament, teams, matches } = data;
            const body = document.getElementById('widget-body');
            body.className = tournament.game;
            const root = document.getElementById('widget-root');

            let content = '';

            // Phase label
            const phaseLabel = {
                pending: 'Sin Iniciar', swiss: 'Fase Suiza',
                elimination: 'Eliminación', done: '🏆 Finalizado'
            }[tournament.phase] || tournament.phase;

            content += `<div class="header">
      <div class="header-title">${tournament.name}</div>
      <div class="header-phase">${phaseLabel}</div>
    </div>`;

            // Champion
            if (tournament.phase === 'done') {
                const elimMatches = matches.filter(m => m.phase === 'elimination');
                const maxRound = Math.max(...elimMatches.map(m => m.round));
                const finalMatch = elimMatches.filter(m => m.round === maxRound)[0];
                const champ = finalMatch?.winner;
                if (champ) {
                    content += `<div class="champion-banner">
          <div class="champion-title">🏆 Campeón</div>
          <div class="champion-name">${champ.name}</div>
        </div>`;
                }
            }

            const showPhase = PHASE_FILTER || 'all';

            if ((showPhase === 'all' || showPhase === 'swiss') && tournament.format === 'swiss_elimination') {
                content += renderSwiss(matches);
            }

            if ((showPhase === 'all' || showPhase === 'elimination')) {
                content += renderElim(matches);
            }

            if (showPhase === 'all' || showPhase === 'standings') {
                content += renderStandings(teams);
            }

            root.innerHTML = content;
        }

        // Initial fetch + auto-refresh cada 15 segundos
        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>

</html>
